<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Steam 消费报告</title>
<style>
:root{--bg:#1a1a1a;--panel:#232323;--panel2:#2b2b2b;--fg:#e0e0e0;--muted:#888;--accent:#66c0f4;--pos:#8bc34a;--neg:#e57373;--gift:#ba68c8;--mkt:#ffb74d;--ig:#4fc3f7;}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--bg);color:var(--fg);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;font-size:14px;line-height:1.5;-webkit-text-size-adjust:100%}
a{color:var(--accent);text-decoration:none}
h1{font-size:20px;margin:0 0 4px}
h2{font-size:16px;margin:24px 0 8px;color:var(--accent);border-bottom:1px solid #333;padding-bottom:4px}
.wrap{max-width:960px;margin:0 auto;padding:12px}
.sub{color:var(--muted);font-size:12px;margin-bottom:16px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px}
.card{background:var(--panel);border:1px solid #333;border-radius:8px;padding:10px}
.card .k{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.5px}
.card .v{font-size:20px;font-weight:600;margin-top:4px;color:var(--accent);word-break:break-all}
.card .n{font-size:11px;color:var(--muted);margin-top:2px}
.chart{background:var(--panel);border:1px solid #333;border-radius:8px;padding:10px;overflow-x:auto}
svg{display:block;max-width:100%;height:auto}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:12px;margin-top:6px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:4px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px}
.tbl-wrap{overflow-x:auto;background:var(--panel);border:1px solid #333;border-radius:8px}
table{border-collapse:collapse;width:100%;font-size:13px;min-width:520px}
th,td{padding:6px 8px;text-align:left;border-bottom:1px solid #2f2f2f;white-space:nowrap}
th{background:var(--panel2);position:sticky;top:0;font-weight:600;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.5px}
tr.exp{background:#1e1e1e}
tr.child td{background:#1a1a1a;color:var(--muted);font-size:12px;padding-left:24px}
.num{font-variant-numeric:tabular-nums;text-align:right}
.pos{color:var(--pos)}.neg{color:var(--neg);text-decoration:line-through}
.controls{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.controls input,.controls select{background:var(--panel);color:var(--fg);border:1px solid #444;border-radius:4px;padding:6px 8px;font-size:13px}
.controls input[type=search]{flex:1;min-width:120px}
details{background:var(--panel);border:1px solid #333;border-radius:8px;padding:8px 10px;margin-top:8px}
summary{cursor:pointer;color:var(--accent);font-weight:600}
.pill{display:inline-block;padding:1px 6px;border-radius:10px;background:#333;color:var(--fg);font-size:11px;margin-right:4px}
.type-Purchase{background:#1e4a63}.type-In-Game{background:#0d5b7a}.type-Gift{background:#5a3670}.type-Market{background:#805a1d}.type-Refund{background:#7a2020;color:#fdd}
.foot{color:var(--muted);font-size:11px;text-align:center;margin-top:24px;padding:12px 0}
</style>
</head>
<body>
<div class="wrap">
<h1>Steam 消费报告</h1>
<div class="sub" id="meta"></div>

<div class="cards" id="cards"></div>

<h2>按年消费</h2>
<div class="chart" id="yearChart"></div>
<div class="legend">
  <span><i style="background:var(--accent)"></i>游戏</span>
  <span><i style="background:var(--ig)"></i>In-Game</span>
  <span><i style="background:var(--gift)"></i>Gift</span>
  <span><i style="background:var(--mkt)"></i>Market</span>
</div>

<h2>Top 20 游戏消费</h2>
<div class="tbl-wrap"><table id="topGamesTbl"><thead><tr>
<th>#</th><th>游戏</th><th class="num">花费</th><th class="num">次数</th><th>首次</th><th>末次</th>
</tr></thead><tbody></tbody></table></div>

<h2>Top 20 In-Game / 氪金物品</h2>
<div class="tbl-wrap"><table id="topIngameTbl"><thead><tr>
<th>#</th><th>物品</th><th>母游戏</th><th class="num">花费</th><th class="num">次数</th>
</tr></thead><tbody></tbody></table></div>

<h2>完整交易明细 <span id="txnCount" style="color:var(--muted);font-size:12px"></span></h2>
<div class="controls">
  <select id="fType"><option value="">全部类型</option></select>
  <input type="search" id="fSearch" placeholder="搜索游戏 / 物品名…">
</div>
<div class="tbl-wrap"><table id="ledger"><thead><tr>
<th>日期</th><th>类型</th><th class="num">金额</th><th>游戏 / 物品</th><th>支付</th>
</tr></thead><tbody></tbody></table></div>

<details><summary>钱包活动（<span id="walletN"></span>）</summary>
<div class="tbl-wrap" style="margin-top:8px"><table id="walletTbl"><thead><tr>
<th>日期</th><th>类型</th><th class="num">金额</th><th>币种</th>
</tr></thead><tbody></tbody></table></div>
</details>

</div>

<script>
const D = JSON.parse(document.getElementById('data').textContent);
const fmt = (n, cur='¥') => cur + Number(n).toLocaleString('zh-CN',{minimumFractionDigits:2,maximumFractionDigits:2});
const esc = s => (s==null?'':String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])));

// Meta / cards
document.getElementById('meta').textContent =
  `${D.date_min} → ${D.date_max} · ${D.txn_count} 笔交易 · ${D.game_count} 款游戏`;

const primary = D.totals['¥'] || {spend:0, refund:0, market:0};
const other = Object.entries(D.totals).filter(([c])=>c!=='¥')
  .map(([c,v])=>`${c}${v.spend.toFixed(2)}`).join(' · ');
const cards = [
  {k:'总消费', v:fmt(primary.spend), n: other?('+ '+other):('净支出 '+fmt(primary.spend-primary.refund))},
  {k:'交易笔数', v:D.txn_count, n:`${D.game_count} 款游戏 · ${D.span_years} 年`},
  {k:'Market 交易', v:fmt(primary.market||0), n:'钱包内二级市场'},
  {k:'最贵游戏', v:D.most_expensive_game?fmt(D.most_expensive_game.total_paid_local):'-', n:D.most_expensive_game?D.most_expensive_game.name:''},
  {k:'最贵氪金物品', v:D.most_expensive_ingame?fmt(D.most_expensive_ingame.total):'-', n:D.most_expensive_ingame?D.most_expensive_ingame.name:''},
];
document.getElementById('cards').innerHTML = cards.map(c =>
  `<div class="card"><div class="k">${esc(c.k)}</div><div class="v">${esc(c.v)}</div><div class="n">${esc(c.n)}</div></div>`
).join('');

// Yearly stacked bar chart (inline SVG)
(function(){
  const years = Object.keys(D.yearly).sort();
  const cats = [
    {k:'Purchase', color:'var(--accent)'},
    {k:'In-Game Purchase', color:'var(--ig)'},
    {k:'Gift Purchase', color:'var(--gift)'},
    {k:'Market Transaction', color:'var(--mkt)'},
  ];
  const totals = years.map(y => cats.reduce((s,c)=>s+(D.yearly[y][c.k]||0),0));
  const max = Math.max(1, ...totals);
  const W = Math.max(320, years.length * 60);
  const H = 260, padL = 44, padB = 40, padT = 10;
  const bw = (W - padL - 10) / years.length * 0.7;
  const step = (W - padL - 10) / years.length;
  let bars = '', labels = '', gridY = '';
  for (let i=0;i<=4;i++){
    const y = padT + (H-padT-padB) * i/4;
    const v = Math.round(max * (1 - i/4));
    gridY += `<line x1="${padL}" y1="${y}" x2="${W}" y2="${y}" stroke="#333"/>`;
    gridY += `<text x="${padL-4}" y="${y+4}" fill="#888" font-size="10" text-anchor="end">${v}</text>`;
  }
  years.forEach((yr, i) => {
    const x = padL + step*i + (step-bw)/2;
    let stackY = H - padB;
    cats.forEach(c => {
      const v = D.yearly[yr][c.k] || 0;
      if (v <= 0) return;
      const h = (v/max) * (H - padT - padB);
      stackY -= h;
      bars += `<rect x="${x}" y="${stackY}" width="${bw}" height="${h}" fill="${c.color}"><title>${yr} ${c.k}: ¥${v.toFixed(2)}</title></rect>`;
    });
    labels += `<text x="${x+bw/2}" y="${H-padB+14}" fill="#888" font-size="10" text-anchor="middle">${yr.slice(2)}</text>`;
    labels += `<text x="${x+bw/2}" y="${stackY-3}" fill="#e0e0e0" font-size="10" text-anchor="middle">${totals[i]>=100?Math.round(totals[i]):totals[i].toFixed(0)}</text>`;
  });
  document.getElementById('yearChart').innerHTML =
    `<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" preserveAspectRatio="xMinYMin meet">${gridY}${bars}${labels}</svg>`;
})();

// Top games table
document.querySelector('#topGamesTbl tbody').innerHTML = D.top_games.map((g,i)=>`
<tr><td>${i+1}</td><td>${esc(g.name)}</td><td class="num">${fmt(g.total_paid_local)}</td>
<td class="num">${g.purchase_count}</td><td>${esc(g.first_purchase||'')}</td><td>${esc(g.last_purchase||'')}</td></tr>
`).join('');

document.querySelector('#topIngameTbl tbody').innerHTML = D.top_ingame.map((g,i)=>`
<tr><td>${i+1}</td><td>${esc(g.name)}</td><td>${esc(g.parent||'')}</td>
<td class="num">${fmt(g.total, g.currency||'¥')}</td><td class="num">${g.n}</td></tr>
`).join('');

// Wallet
document.getElementById('walletN').textContent = D.wallet.length;
document.querySelector('#walletTbl tbody').innerHTML = D.wallet.map(w=>`
<tr><td>${esc(w.date||'')}</td><td>${esc(w.type)}</td>
<td class="num">${fmt(w.amount_local||0, w.currency||'¥')}</td><td>${esc(w.currency||'')}</td></tr>
`).join('');

// Ledger + filters
const itemsByTxn = {};
D.items.forEach(it => { (itemsByTxn[it.transaction_id] ||= []).push(it); });
const typeShort = t => t.replace('In-Game Purchase','In-Game').replace('Market Transaction','Market').replace('Gift Purchase','Gift');
const types = [...new Set(D.transactions.map(t=>t.type))].sort();
const sel = document.getElementById('fType');
types.forEach(t => { const o = document.createElement('option'); o.value = t; o.textContent = t; sel.appendChild(o); });

function renderLedger(){
  const q = document.getElementById('fSearch').value.trim().toLowerCase();
  const ft = sel.value;
  const rows = D.transactions.filter(t => {
    if (ft && t.type !== ft) return false;
    if (!q) return true;
    if ((t.payment_method||'').toLowerCase().includes(q)) return true;
    const its = itemsByTxn[t.transaction_id] || [];
    return its.some(i => (i.name||'').toLowerCase().includes(q));
  });
  document.getElementById('txnCount').textContent = `(${rows.length}/${D.transactions.length})`;
  const body = document.querySelector('#ledger tbody');
  body.innerHTML = rows.map((t, idx) => {
    const its = itemsByTxn[t.transaction_id] || [];
    const gname = its[0]?.name || (t.type==='Wallet Credit'?'（钱包充值）':'');
    const cls = 'type-' + typeShort(t.type).replace(/[^A-Za-z]/g,'');
    const amtCls = t.type==='Refund' ? 'neg num' : 'num';
    return `<tr class="exp" data-idx="${idx}"><td>${esc(t.date||'')}</td>
<td><span class="pill ${cls}">${typeShort(t.type)}</span></td>
<td class="${amtCls}">${fmt(t.amount_local||0, t.currency||'¥')}</td>
<td>${esc(gname)}${its.length>1?` <span style="color:var(--muted)">+${its.length-1}</span>`:''}</td>
<td>${esc(t.payment_method||'')}</td></tr>` +
(its.length ? its.map(i => `<tr class="child" data-parent="${idx}" hidden>
<td></td><td>#${i.position}</td>
<td class="num">${fmt(i.sub_amount_local||0, t.currency||'¥')}</td>
<td colspan="2">${esc(i.name)}${i.appid?` <span style="color:var(--muted)">appid ${i.appid}</span>`:''}</td>
</tr>`).join('') : '');
  }).join('');
  body.querySelectorAll('tr.exp').forEach(tr => {
    tr.addEventListener('click', () => {
      const idx = tr.dataset.idx;
      body.querySelectorAll(`tr.child[data-parent="${idx}"]`).forEach(c => c.hidden = !c.hidden);
    });
  });
}
document.getElementById('fSearch').addEventListener('input', renderLedger);
sel.addEventListener('change', renderLedger);
renderLedger();
</script>
</body>
