<script>
const DATA = JSON.parse(document.getElementById('today-data').textContent);
const COUNT = 3;
function seriesKey(g) { return (g.series || []).map(s => String(s).toLowerCase().replace(/[^a-z0-9]+/g,'')).filter(Boolean).join('|'); }
function weightedDraw(pool, n) {
  const best = Math.max(...pool.map(x => x.score));
  let items = pool.slice(); const picked = []; const seen = new Set();
  while (items.length && picked.length < n) {
    const weights = items.map(x => Math.pow(x.score - (best - 0.15) + 0.02, 2));
    let r = Math.random() * weights.reduce((a,b)=>a+b,0); let idx = 0;
    for (; idx < weights.length; idx++) { r -= weights[idx]; if (r <= 0) break; }
    const g = items[Math.min(idx, items.length-1)]; picked.push(g);
    const sk = seriesKey(g); if (sk) seen.add(sk);
    items = items.filter(x => x !== g && (!seriesKey(x) || !seen.has(seriesKey(x))));
  }
  return picked;
}
function esc(value) { return String(value ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function intro(g) {
  if (g.description) return g.description;
  const genres = (g.genres || []).slice(0, 2);
  const tags = (g.tags || []).slice(0, 3);
  const type = genres.length ? genres.join('、') : '电子游戏';
  if (tags.length) return `这是一款${esc(type)}游戏，包含${tags.map(esc).join('、')}等特点。`;
  return `这是一款${esc(type)}游戏。`;
}
const TONES = [
  ['#e5efe7','#b8d0bd'], ['#e7edf8','#bdc9e2'], ['#f6e9df','#e4bfa8'], ['#f4efd8','#ddd09a'], ['#eee5f3','#d4bddf']
];
function toneFor(name) {
  let hash = 0;
  for (const char of String(name)) hash = (hash * 31 + char.charCodeAt(0)) >>> 0;
  return TONES[hash % TONES.length];
}
function render() {
  const cards = weightedDraw(DATA, COUNT);
  document.getElementById('cards').innerHTML = cards.map((g,i) => `
    <article class="card" style="--tone:${toneFor(g.name)[0]};--tone-line:${toneFor(g.name)[1]};--i:${i}">
      <div class="media">${g.coverUrl ? `<img class="cover" src="${esc(g.coverUrl)}" alt="">` : `<div class="cover"></div>`}</div>
      <div class="body">
        <h2>${g.storeUrl ? `<a href="${esc(g.storeUrl)}" target="_blank" rel="noopener">${esc(g.name)}</a>` : esc(g.name)}</h2>
        <p class="intro">${intro(g)}</p>
      </div>
    </article>`).join('');
}
document.getElementById('reroll').addEventListener('click', render); render();
</script>
