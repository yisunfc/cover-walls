<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>按年份通关游戏</title>
<style>

:root { color-scheme: dark; font-family: system-ui, -apple-system, sans-serif; background: #101216; }
* { box-sizing: border-box; }
body { margin: 0; background: #101216; }
.completed-wall { max-width: 1440px; margin: 0 auto; padding: 18px; }
.completed-controls { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin: 0 0 18px; }
#completed-year, .orientation-button { min-height: 2.25rem; border: 1px solid #60749c; border-radius: 6px; background: #172033; color: #f5f7fa; font: inherit; }
#completed-year { padding: 0 10px; }
.orientation-controls { display: flex; gap: 6px; }
.orientation-button { width: 2.5rem; padding: 0; font-size: 1.3rem; line-height: 1; cursor: pointer; }
#completed-year:focus-visible, .orientation-button:focus-visible { outline: 3px solid #74b9ff; outline-offset: 3px; }
.orientation-button[aria-pressed="true"] { border-color: #8ec5ff; background: #29476a; }
.completed-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(112px, 1fr)); gap: 10px; }
.completed-grid.is-landscape { grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); }
.card { overflow: hidden; min-width: 0; border-radius: 7px; background: #202733; box-shadow: 0 5px 18px rgba(0, 0, 0, .28); }
.card img { display: block; width: 100%; aspect-ratio: 2 / 3; object-fit: cover; background: #202733; }
.completed-grid.is-landscape .card img { aspect-ratio: 3 / 2; }
@media (max-width: 520px) { .completed-wall { padding: 12px; } .completed-grid { grid-template-columns: repeat(auto-fill, minmax(92px, 1fr)); gap: 7px; } .completed-grid.is-landscape { grid-template-columns: repeat(auto-fill, minmax(142px, 1fr)); } }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { scroll-behavior: auto !important; transition: none !important; } }

</style>
</head>

<script>

(() => {
  const select = document.getElementById('completed-year');
  const sections = [...document.querySelectorAll('.completed-year[data-year]')];
  const orientationButtons = [...document.querySelectorAll('.orientation-button[data-orientation]')];
  if (!select || !sections.length) return;
  const validYears = new Set([...select.options].map((option) => option.value));
  const defaultYear = select.value;
  function requestedYear() {
    const match = /^#year=(\d{4}|undated)$/.exec(window.location.hash);
    return match && validYears.has(match[1]) ? match[1] : defaultYear;
  }
  function selectYear(year, updateHash) {
    const selected = validYears.has(year) ? year : defaultYear;
    select.value = selected;
    sections.forEach((section) => { section.hidden = section.dataset.year !== selected; });
    if (updateHash && window.location.hash !== `#year=${selected}`) {
      history.replaceState(null, '', `#year=${selected}`);
    }
  }
  function selectOrientation(orientation) {
    document.querySelectorAll('.completed-grid').forEach((grid) => {
      grid.classList.toggle('is-landscape', orientation === 'landscape');
    });
    document.querySelectorAll('.completed-card img').forEach((image) => {
      image.dataset.fallbackUrl = image.dataset[`${orientation}FallbackUrl`];
      image.src = image.parentElement.dataset[`${orientation}Url`];
    });
    orientationButtons.forEach((button) => {
      button.setAttribute('aria-pressed', String(button.dataset.orientation === orientation));
    });
  }
  document.addEventListener('error', (event) => {
    const image = event.target;
    if (image.matches && image.matches('.completed-card img') && image.src !== image.dataset.fallbackUrl) {
      image.src = image.dataset.fallbackUrl;
    }
  }, true);
  select.addEventListener('change', () => selectYear(select.value, true));
  orientationButtons.forEach((button) => {
    button.addEventListener('click', () => selectOrientation(button.dataset.orientation));
  });
  window.addEventListener('hashchange', () => selectYear(requestedYear(), false));
  selectYear(requestedYear(), false);
})();

</script>
