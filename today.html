function seriesKey(g) { return (g.series || []).map(s => String(s).toLowerCase().replace(/[^a-z0-9]+/g,'')).filter(Boolean).join('|'); }
function weightedDraw(pool, n) {
  const best = Math.max(...pool.map(x => x.score));
  let items = pool.slice(); const picked = []; const seen = new Set();
  while (items.length && picked.length < n) {
    const weights = items.map(x => Math.pow(x.score - (best - 0.15) + 0.02, 2));
    let r = Math.random() * weights.reduce((a,b)=>a+b,0); let idx = 0;

    return `<article class="card ${layout}" style="--wash:${toneFor(g.name)[0]};--wash-line:${toneFor(g.name)[1]};--i:${i}">
      <div class="art">${cover}</div>
      <div class="card-body"><h3 class="game-title">${title}</h3><p class="intro">${intro(g)}</p>${open}</div>
    </article>`;
  }).join('');
}
document.getElementById('reroll').addEventListener('click', render); render();
</script>
</body>
</html>
