<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>顶部档案区对齐稿</title>
<style>
:root{--violet:#4b347f;--ink:#fbf9ff;--soft:rgba(255,255,255,.72);--glass:rgba(111,86,166,.35);--line:rgba(255,255,255,.17)}*{box-sizing:border-box}body{margin:0;background:#17102c;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;color:var(--ink)}.screen{width:min(100%,480px);margin:auto;position:relative;overflow:hidden;padding-bottom:16px;background:radial-gradient(circle at 90% 2%,rgba(140,111,236,.48),transparent 25%),radial-gradient(circle at 4% 78%,rgba(95,83,198,.58),transparent 31%),linear-gradient(148deg,#30265a 0%,#4b347f 53%,#7051a5 100%)}.screen:before,.screen:after{content:"";position:absolute;pointer-events:none}.screen:before{width:440px;height:260px;right:-105px;top:-52px;background:linear-gradient(125deg,transparent 36%,rgba(197,187,255,.12) 36% 37%,transparent 37% 58%,rgba(197,187,255,.10) 58% 59%,transparent 59%);transform:skewY(-7deg)}.screen:after{inset:0;background:radial-gradient(circle at 18% 17%,rgba(255,255,255,.24) 0 1px,transparent 2px),radial-gradient(circle at 72% 11%,rgba(255,255,255,.18) 0 1px,transparent 2px);background-size:47px 39px,71px 55px;opacity:.34}.profile{position:relative;z-index:1;display:flex;align-items:center;gap:13px;padding:27px 23px 21px}.avatar{display:grid;place-items:center;width:59px;height:59px;flex:0 0 59px;border-radius:50%;border:2px solid rgba(255,255,255,.88);background:linear-gradient(145deg,#fff4fa 0 36%,#be9bdc 37% 50%,#5e418f 51%);color:#4b347f;font-size:17px;font-weight:900;box-shadow:0 5px 15px rgba(21,12,62,.25)}.identity{min-width:0;flex:1}.identity h1{margin:0;font-size:22px;line-height:1.1;letter-spacing:.015em;white-space:nowrap}.identity p{margin:6px 0 0;color:rgba(255,255,255,.7);font-size:11px}.badge{display:flex;align-items:center;gap:4px;color:#fff;font-weight:800;font-size:14px;white-space:nowrap;text-shadow:0 0 12px rgba(255,241,165,.82)}.badge:before,.badge:after{content:"❯";font-size:20px;color:#f4e6ff;text-shadow:none}.badge:after{transform:scaleX(-1)}.stat-card{position:relative;z-index:1;margin:0 14px;border:1px solid var(--line);border-radius:22px;background:linear-gradient(110deg,rgba(180,150,226,.23),rgba(73,47,119,.28));box-shadow:inset 0 1px 0 rgba(255,255,255,.08),0 15px 28px rgba(32,17,70,.15);backdrop-filter:blur(8px)}.metrics{display:grid;grid-template-columns:repeat(4,1fr);padding:22px 14px 15px}.metric{min-width:0;text-align:center}.metric strong{display:block;font-size:20px;letter-spacing:-.045em;white-space:nowrap}.metric span{display:block;margin-top:7px;color:var(--soft);font-size:10px;line-height:1.25}.platforms{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:5px;padding:0 14px 18px}.platform{height:32px;min-width:0;border-radius:6px;display:flex;align-items:center;justify-content:center;gap:4px;color:white;font-size:10px;font-weight:800;white-space:nowrap}.platform b{display:grid;place-items:center;flex:0 0 18px;width:18px;height:18px;border-radius:3px;background:rgba(0,0,0,.2);font-size:9px}.platform b img{display:block;width:12px;height:12px;object-fit:contain}.steam{background:#3379b8}.xbox{background:#369546}.epic{background:#545454}.ps{background:#268bd3}.switch{background:#e62e3d}.note{position:relative;z-index:1;margin:13px 22px 0;color:rgba(255,255,255,.58);font-size:10px;text-align:center}.guide{position:fixed;left:12px;bottom:12px;padding:7px 10px;border-radius:999px;background:rgba(19,12,43,.72);color:#e5ddff;font-size:11px}@media(min-width:481px){.screen{box-shadow:0 22px 65px rgba(7,3,25,.55)}}
</style>
</head>
<body>
<main class="screen">
  <header class="profile">
    <div class="avatar" aria-hidden="true">GP</div>
    <div class="identity"><h1>游戏生涯档案</h1><p>显示名与头像后续可配置</p></div>
    <div class="badge">多平台玩家</div>
  </header>
  <section class="stat-card" aria-label="示例生涯统计">
    <div class="metrics">
      <div class="metric"><strong>53,591</strong><span>生涯游戏价值 ¥</span></div>
      <div class="metric"><strong>10,476.6</strong><span>生涯游戏时长 h</span></div>
      <div class="metric"><strong>1,039</strong><span>生涯游戏数量</span></div>
      <div class="metric"><strong>15</strong><span>完美数</span></div>
    </div>
    <div class="platforms">
      <div class="platform steam"><b><img src="career-assets/icons/steam.svg" alt="Steam"></b>6,556 h</div><div class="platform xbox"><b><img src="career-assets/icons/xbox.svg" alt="Xbox"></b>3,085 h</div><div class="platform epic"><b><img src="career-assets/icons/epic.svg" alt="Epic Games"></b>486 h</div><div class="platform ps"><b><img src="career-assets/icons/playstation.svg" alt="PlayStation"></b>263 h</div><div class="platform switch"><b><img src="career-assets/icons/nintendo-switch.svg" alt="Nintendo Switch"></b>85 h</div>
    </div>
  </section>
  <p class="note">顶部档案区对齐稿 - 所有数字和标识均为示例，只验证布局与视觉。</p>
</main>
<p class="guide">只做第 1 块，未发布</p>
</body></html>
