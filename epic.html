<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>Epic Games Library</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Cache-Control" content="public, max-age=3600">
<style>
:root{--bg:#0f1622;--panel:#17202e;--panel2:#1e2a3c;--fg:#d6e0f0;--muted:#8fa0b8;--accent:#66c0f4;--chip:#2a3a52;--chip-active:#1b6fb8;--danger:#e07a5f;--ok:#7dcc82;}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--bg);color:var(--fg);font-family:-apple-system,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;font-size:14px;}
header{padding:14px 20px;background:linear-gradient(180deg,#17202e,#0f1622);border-bottom:1px solid #253247;display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:10;}
header h1{margin:0;font-size:20px;font-weight:600;}
.stats{color:var(--muted);font-size:12px;}
.search{flex:0 0 260px;}
.search input{width:100%;padding:8px 10px;border-radius:6px;border:1px solid #2b3a52;background:#0b111c;color:var(--fg);}
main{display:flex;min-height:calc(100vh - 60px);}
aside{width:240px;flex:0 0 240px;padding:14px;background:var(--panel);border-right:1px solid #253247;overflow-y:auto;max-height:calc(100vh - 60px);position:sticky;top:60px;}
aside h3{margin:14px 0 6px;font-size:12px;text-transform:uppercase;color:var(--muted);letter-spacing:.5px;}
aside h3:first-child{margin-top:0}
.filter-group label{display:block;padding:3px 0;cursor:pointer;font-size:13px;}
.filter-group input{margin-right:6px;vertical-align:middle;}
.filter-group.hidden{display:none;}
.more-toggle{color:var(--accent);cursor:pointer;font-size:12px;margin-top:4px;user-select:none;}
button.reset{margin-top:12px;width:100%;padding:8px;background:var(--chip);border:0;color:var(--fg);border-radius:6px;cursor:pointer;}
button.reset:hover{background:var(--chip-active);}
section.content{flex:1;padding:14px 20px;min-width:0;}
.toolbar{display:flex;gap:14px;align-items:center;margin-bottom:12px;flex-wrap:wrap;}
.toolbar .group{display:flex;gap:2px;background:var(--panel);border-radius:6px;padding:3px;}
.toolbar button{background:transparent;color:var(--fg);border:0;padding:6px 12px;border-radius:5px;cursor:pointer;font-size:13px;}
.toolbar button.active{background:var(--chip-active);}
.toolbar select{background:var(--panel);border:1px solid #2b3a52;color:var(--fg);padding:6px 10px;border-radius:6px;}
.count{color:var(--muted);margin-left:auto;font-size:12px;}
.grid-h{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px;}
.grid-v{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px;}
.card{background:var(--panel);border-radius:6px;overflow:hidden;position:relative;cursor:pointer;transition:transform .1s,box-shadow .1s;}
.card:hover{transform:translateY(-2px);box-shadow:0 4px 18px rgba(0,0,0,.5);}
.card .cover{width:100%;aspect-ratio:460/215;background:#0b111c;display:block;object-fit:cover;}
.grid-v .card .cover{aspect-ratio:600/900;}
.card img.cover{border:0;}
.card .fallback{width:100%;height:100%;display:flex;align-items:center;justify-content:center;text-align:center;padding:8px;color:var(--muted);font-size:12px;}
.card .meta{padding:8px 10px;}
.card .title{font-size:13px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.card .sub{color:var(--muted);font-size:11px;margin-top:2px;display:flex;gap:6px;flex-wrap:wrap;}
.badges{position:absolute;top:6px;left:6px;display:flex;gap:4px;flex-wrap:wrap;}
.badge{background:rgba(0,0,0,.7);color:#fff;font-size:10px;padding:2px 6px;border-radius:3px;}
.badge.family{background:#8a5cf6cc;}
.badge.played{background:#2f855acc;}
.badge.nohltb{background:#a05a2ccc;}
.badge.rating{background:rgba(27,111,184,0.85);font-weight:600;color:#fff;}
table.tbl{width:100%;border-collapse:collapse;font-size:13px;}
table.tbl th,table.tbl td{padding:6px 8px;border-bottom:1px solid #253247;text-align:left;}
table.tbl th{color:var(--muted);cursor:pointer;user-select:none;font-weight:500;}
table.tbl tr:hover{background:var(--panel);}
table.tbl a{color:var(--accent);text-decoration:none;}
.hidden{display:none !important;}
#detail{position:fixed;top:0;right:0;width:360px;max-width:90vw;height:100vh;background:var(--panel2);border-left:1px solid #253247;padding:16px;overflow-y:auto;transform:translateX(100%);transition:transform .18s;z-index:20;box-shadow:-4px 0 20px rgba(0,0,0,.4);}
#detail.open{transform:translateX(0);}
#detail .close{float:right;cursor:pointer;color:var(--muted);font-size:20px;line-height:1;}
#detail h2{margin:0 0 8px;font-size:18px;}
#detail .kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:13px;margin:12px 0;}
#detail .kv dt{color:var(--muted);}
#detail .chips{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px;}
#detail .chip{background:var(--chip);padding:2px 8px;border-radius:10px;font-size:11px;}
#detail img{width:100%;border-radius:6px;margin:8px 0;}
#detail a.store{display:inline-block;margin-top:8px;background:var(--accent);color:#0b111c;padding:8px 12px;border-radius:6px;font-weight:600;text-decoration:none;}
@media (max-width:768px){aside{position:static;width:100%;max-height:none;}main{flex-direction:column;}}
</style>
</head>
<body>
<header>
  <div>
    <h1>Epic Games Library</h1>
    <div class="stats" id="stats">466 games · 466 Epic · 466 owned · 0 family · 1 with HLTB · 1 已玩</div>
  </div>
  <div class="search"><input id="q" type="search" placeholder="搜索名称、ID / name, id…" autocomplete="off"></div>
</header>
<main>
<aside>
  <div id="platform-filter-block">
    <h3>平台</h3>
    <div class="filter-group" data-group="platform" id="platform-group">
      <label><input type="checkbox" name="platform" value="steam" checked>Steam</label>
      <label><input type="checkbox" name="platform" value="epic" checked>Epic</label>
    </div>
  </div>
  <h3>拥有</h3>
  <div class="filter-group" data-group="source">
    <label><input type="radio" name="source" value="" checked>全部</label>
    <label><input type="radio" name="source" value="owned">我的</label>
    <label><input type="radio" name="source" value="family">家庭共享</label>
  </div>
  <h3>时长 (HLTB main)</h3>
  <div class="filter-group" data-group="hltb">
    <label><input type="radio" name="hltb" value="" checked>全部</label>
    <label><input type="radio" name="hltb" value="lt10">&lt;10h</label>
    <label><input type="radio" name="hltb" value="10_30">10–30h</label>
    <label><input type="radio" name="hltb" value="30_60">30–60h</label>
    <label><input type="radio" name="hltb" value="gt60">60h+</label>
    <label><input type="radio" name="hltb" value="none">无数据</label>
  </div>
  <div id="status-block">
    <h3>Notion 状态</h3>
    <div class="filter-group" data-group="played">
      <label><input type="radio" name="played" value="" checked>全部</label>
      <label><input type="radio" name="played" value="yes">已玩（Notion）</label>
      <label><input type="radio" name="played" value="no">未玩</label>
    </div>
  </div>
  <h3>类别 (Genre)</h3>
  <div class="filter-group" data-group="genres" id="genres"></div>
  <div class="more-toggle" id="more-genres" style="margin-bottom:12px;">展开更多类别 ▾</div>
  <h3>标签 (Tag)</h3>
  <div class="filter-group hidden" data-group="tags" id="tags"></div>
  <div class="more-toggle" id="more-tags">展开标签筛选 ▾</div>
  <button class="reset" id="reset">重置筛选</button>
</aside>
<section class="content">
  <div class="toolbar">
    <div class="group" id="view-toggle">
      <button data-view="grid-h" class="active">横向卡片</button>
      <button data-view="grid-v">纵向卡片</button>
      <button data-view="table">表格</button>
    </div>
    <label>排序
      <select id="sort">
        <option value="name">名称</option>
        <option value="rating">评分 (IGDB)</option>
        <option value="hltb">HLTB 时长</option>
        <option value="playtime">已玩时长</option>
        <option value="year">发售年</option>
        <option value="random">随机</option>
      </select>
    </label>
    <div class="count" id="count"></div>
  </div>
  <div id="view-grid-h" class="grid-h"></div>
  <div id="view-grid-v" class="grid-v hidden"></div>
  <div id="view-table" class="hidden"></div>
</section>
</main>

  }
  // build genre + tag filter panels
  function tally(field){const m={};L.forEach(g=>(g[field]||[]).forEach(t=>{m[t]=(m[t]||0)+1;}));return Object.entries(m).sort((a,b)=>b[1]-a[1]);}
  const genres = tally('genres');
  const tags = tally('tags');
  const gEl = document.getElementById('genres');
  const TOP_G = 8;
  genres.forEach(([g,n],i)=>{gEl.insertAdjacentHTML('beforeend',`<label class="${i<TOP_G?'':'more hidden'}"><input type="checkbox" value="${escape(g)}">${escape(g)} <span style="color:var(--muted)">(${n})</span></label>`);});
  const moreG = document.getElementById('more-genres');
  if(genres.length<=TOP_G){moreG.classList.add('hidden');}
  moreG.addEventListener('click',()=>{gEl.querySelectorAll('label.more').forEach(l=>l.classList.toggle('hidden'));moreG.textContent = moreG.textContent.includes('展开')?'收起 ▴':'展开更多类别 ▾';});

  const tEl = document.getElementById('tags');
  tags.forEach(([t,n])=>{tEl.insertAdjacentHTML('beforeend',`<label><input type="checkbox" value="${escape(t)}">${escape(t)} <span style="color:var(--muted)">(${n})</span></label>`);});
  const moreBtn = document.getElementById('more-tags');
  if(tags.length===0){moreBtn.classList.add('hidden');}
  moreBtn.addEventListener('click',()=>{
    tEl.classList.toggle('hidden');
    moreBtn.textContent = tEl.classList.contains('hidden')?'展开标签筛选 ▾':'收起标签筛选 ▴';
  });

  function escape(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
  function hh(mins){return mins==null?null:Math.round(mins/60);}
  function checkedRadio(name){const el=document.querySelector(`input[name="${name}"]:checked`);return el?el.value:'';}
  function checkedBoxes(root){return Array.from(root.querySelectorAll('input[type="checkbox"]:checked')).map(e=>e.value);}

  let q='',lastRender=0;
  const qEl=document.getElementById('q');
  let qTimer=null;
  qEl.addEventListener('input',()=>{clearTimeout(qTimer);qTimer=setTimeout(()=>{q=qEl.value.trim().toLowerCase();render();},150);});

  let filterTimer=null;
  function scheduleRender(){clearTimeout(filterTimer);filterTimer=setTimeout(render,100);}
  document.querySelectorAll('input[type="radio"],input[type="checkbox"]').forEach(el=>el.addEventListener('change',scheduleRender));
  document.getElementById('sort').addEventListener('change',render);
  document.getElementById('reset').addEventListener('click',()=>{document.querySelectorAll('input[type="radio"]').forEach(r=>{r.checked=(r.value=='')});document.querySelectorAll('input[type="checkbox"]').forEach(c=>c.checked=false);document.querySelectorAll('#platform-group input[type="checkbox"]').forEach(c=>c.checked=true);qEl.value='';q='';render();});

  let currentView='grid-h';
  document.querySelectorAll('#view-toggle button').forEach(b=>b.addEventListener('click',()=>{
    document.querySelectorAll('#view-toggle button').forEach(x=>x.classList.remove('active'));
    b.classList.add('active');
    currentView=b.dataset.view;
    ['grid-h','grid-v','table'].forEach(v=>document.getElementById('view-'+v).classList.toggle('hidden',v!==currentView));
    render();
  }));

  function filterAll(){
    const src=checkedRadio('source'),h=checkedRadio('hltb'),p=checkedRadio('played');
    const plats=checkedBoxes(document.getElementById('platform-group'));
    const gs=checkedBoxes(document.getElementById('genres'));
    const ts=checkedBoxes(document.getElementById('tags'));
    return L.filter(g=>{
      if(plats.length && !plats.includes(g.platform||'steam')) return false;
      if(src && g.source!==src) return false;
      if(p==='yes' && !g.played) return false;
      if(p==='no' && g.played) return false;
      if(h){const hm=g.hltb_main;
        if(h==='none' && hm!=null) return false;
        if(h!=='none'){if(hm==null) return false;const hr=hm/60;
          if(h==='lt10' && !(hr<10)) return false;
          if(h==='10_30' && !(hr>=10&&hr<30)) return false;
          if(h==='30_60' && !(hr>=30&&hr<60)) return false;
          if(h==='gt60' && !(hr>=60)) return false;}}
      if(gs.length && !gs.every(x=>g.genres.includes(x))) return false;
      if(ts.length && !ts.every(x=>g.tags.includes(x))) return false;
      if(q){
        const n=(g.name||'').toLowerCase(), ne=(g.name_en||'').toLowerCase(), id=(g.appid||'').toLowerCase();
        if(!n.includes(q) && !ne.includes(q) && !id.includes(q)) return false;
      }
      return true;
    });
  }
  function sortList(list){
    const s=document.getElementById('sort').value;
    const c=[...list];
    function getRating(g){
      if(!g.ratings || !g.ratings.IGDB) return -1;
      const m = String(g.ratings.IGDB).match(/(\d+)/);
      return m ? parseInt(m[1],10) : -1;
    }
    if(s==='name') c.sort((a,b)=>(a.name||'').localeCompare(b.name||''));
    else if(s==='rating') c.sort((a,b)=>getRating(b)-getRating(a));
    else if(s==='hltb') c.sort((a,b)=>(b.hltb_main||-1)-(a.hltb_main||-1));
    else if(s==='playtime') c.sort((a,b)=>(b.playtime_minutes||0)-(a.playtime_minutes||0));
    else if(s==='year') c.sort((a,b)=>(b.year||0)-(a.year||0));
    else if(s==='random') c.sort(()=>Math.random()-0.5);
    return c;
  }
  function cardHtml(g,vertical){
    const h=hh(g.hltb_main);
    const cover = vertical?g.cover_vertical:g.cover_horizontal;
    const badges=[];
    if(g.ratings && g.ratings.IGDB) badges.push(`<span class="badge rating">★ ${escape(g.ratings.IGDB)}</span>`);
    if(g.source==='family') badges.push('<span class="badge family">家庭</span>');
    if(g.played) badges.push('<span class="badge played">已玩</span>');
    if(g.hltb_main==null) badges.push('<span class="badge nohltb">无 HLTB</span>');
    const sub=[];
    if(h!=null) sub.push(`~${h}h`);
    if(g.year) sub.push(g.year);
    if(g.genres.length) sub.push(escape(g.genres.slice(0,2).join(', ')));
    const dims = vertical?'width="300" height="450"':'width="460" height="215"';
    const img = cover
      ? `<img class="cover" src="${cover}" loading="lazy" decoding="async" ${dims} alt="${escape(g.name)}" onerror="this.style.display='none'">`
      : `<div class="cover"><span class="fallback">${escape(g.name)}</span></div>`;
    return `<div class="card" data-id="${g.appid}">
      <div class="badges">${badges.join('')}</div>
      ${img}
      <div class="meta"><div class="title">${escape(g.name)}</div><div class="sub">${sub.join(' · ')}</div></div>
    </div>`;
  }
  function tableHtml(list){
    const rows=list.map(g=>{
      const rStr = (g.ratings && g.ratings.IGDB) ? escape(g.ratings.IGDB) : '—';
      return `<tr data-id="${g.appid}"><td>${escape(g.name)}</td><td>${rStr}</td><td>${escape(g.appid)}</td><td>${g.year||''}</td><td>${hh(g.hltb_main)??''}</td><td>${Math.round((g.playtime_minutes||0)/60)}</td><td>${g.platform==='epic'?'Epic':'Steam'}</td><td>${g.source==='family'?'家庭':'我的'}</td><td>${g.played?'✓':(g.played===false?'':'—')}</td><td><a href="${g.store_url}" target="_blank" rel="noopener">${g.platform==='epic'?'Epic':'Steam'}</a></td></tr>`;
    }).join('');
    return `<table class="tbl"><thead><tr><th>名称</th><th>评分</th><th>External ID</th><th>年</th><th>HLTB(h)</th><th>已玩(h)</th><th>平台</th><th>来源</th><th>Notion</th><th></th></tr></thead><tbody>${rows}</tbody></table>`;
  }
  const PAGE=60;
  let currentList=[],renderedCount=0,io=null;
  function ensureObserver(container){
    if(io){io.disconnect();}
    io = new IntersectionObserver(entries=>{
      for(const e of entries){if(e.isIntersecting){appendPage(container);}}
    },{rootMargin:'400px'});
    const s=container.querySelector('.sentinel');
    if(s) io.observe(s);
  }
  function appendPage(container){
    if(renderedCount>=currentList.length){
      const s=container.querySelector('.sentinel');if(s)s.remove();
      if(io)io.disconnect();
      return;
    }
    const slice=currentList.slice(renderedCount,renderedCount+PAGE);
    const vertical = currentView==='grid-v';
    const html=slice.map(g=>cardHtml(g,vertical)).join('');
    const s=container.querySelector('.sentinel');
    if(s) s.insertAdjacentHTML('beforebegin',html);
    else container.insertAdjacentHTML('beforeend',html);
    renderedCount+=slice.length;
    if(renderedCount>=currentList.length){
      const s2=container.querySelector('.sentinel');if(s2)s2.remove();
      if(io)io.disconnect();
    }
  }
  function render(){
    currentList=sortList(filterAll());
    document.getElementById('count').textContent=`${currentList.length} / ${L.length}`;
    if(currentView==='table'){
      document.getElementById('view-table').innerHTML=tableHtml(currentList);
      renderedCount=currentList.length;
      if(io){io.disconnect();io=null;}
      bindCards();
      return;
    }
    const container = document.getElementById(currentView==='grid-h'?'view-grid-h':'view-grid-v');
    container.innerHTML='<div class="sentinel" style="grid-column:1/-1;height:1px;"></div>';
    renderedCount=0;
    appendPage(container);
    ensureObserver(container);
    bindCards();
  }
  function bindCards(){/* handled by delegation */}
  document.querySelector('section.content').addEventListener('click',(e)=>{
    if(e.target.tagName==='A')return;
    const el=e.target.closest('.card, table.tbl tbody tr');
    if(!el||!el.dataset.id)return;
    const g=L.find(x=>x.appid===el.dataset.id);
    if(g)openDetail(g);
  });
  function openDetail(g){
    const h=hh(g.hltb_main),he=hh(g.hltb_hastily),hc=hh(g.hltb_completionist);
    const body=`
      <h2>${escape(g.name)}</h2>${g.name_en?`<div style="color:var(--muted)">${escape(g.name_en)}</div>`:''}
      <img src="${g.cover_horizontal}" loading="lazy" decoding="async" alt="">
      <dl class="kv">
        <dt>来源</dt><dd>${g.source==='family'?'家庭共享':'我的'}</dd>
        <dt>评分</dt><dd>${(g.ratings&&Object.keys(g.ratings).length)?Object.entries(g.ratings).map(([k,v])=>`<span style="color:var(--accent);font-weight:600;">★ ${escape(k)}: ${escape(v)}</span>`).join(' | '):'暂无评分'}</dd>
        <dt>External ID</dt><dd><code>${escape(g.appid)}</code></dd>
        <dt>发售年</dt><dd>${g.year||'—'}</dd>
        <dt>已玩</dt><dd>${Math.round((g.playtime_minutes||0)/60)} h (${g.playtime_minutes||0} min)</dd>
        <dt>HLTB Rushed</dt><dd>${he??'—'} h</dd>
        <dt>HLTB Main</dt><dd>${h??'—'} h</dd>
        <dt>HLTB 100%</dt><dd>${hc??'—'} h</dd>
        <dt>Notion</dt><dd>${g.played===null?'未知':(g.played?'已入库':'未入库')}</dd>
        <dt>类别</dt><dd><div class="chips">${g.genres.map(x=>`<span class="chip">${escape(x)}</span>`).join('')||'—'}</div></dd>
        <dt>标签</dt><dd><div class="chips">${g.tags.map(x=>`<span class="chip">${escape(x)}</span>`).join('')||'—'}</div></dd>
      </dl>
      <a class="store" href="${g.store_url}" target="_blank" rel="noopener">${g.platform==='epic'?'在 Epic 商城打开':'在 Steam 打开'}</a>
      ${g.platform==='epic'?`<a class="store" style="margin-left:8px;background:#313b4c;color:#fff;" href="com.epicgames.launcher://apps/${encodeURIComponent(g.appid)}?action=launch">启动 Epic 客户端</a>`:''}
    `;
    document.getElementById('detail-body').innerHTML=body;
    document.getElementById('detail').classList.add('open');
  }
  window.closeDetail=()=>document.getElementById('detail').classList.remove('open');
  document.addEventListener('keydown',e=>{if(e.key==='Escape')closeDetail();});
  render();
})();
</script>
</body></html>
